name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y caddy
      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx python-multipart aiosmtpd
      - name: Run test suite
        run: pytest tests/ -q -k "not test_interactive_cli and not test_v073_features"
        # test_interactive_cli.py and test_v073_features.py are integration
        # tests that need a live agent already running with a logged-in
        # session — not runnable as plain unit tests in CI. Everything else
        # (46 of 48 tests as of this writing) is covered here, including
        # cross-test-file database isolation via tests/conftest.py.
