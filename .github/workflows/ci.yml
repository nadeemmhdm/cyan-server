name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y caddy
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Run hardware/OS detection tests
        run: python3 tests/test_detection.py
      - name: Run auth/storage/app-manager tests
        run: python3 tests/test_services.py
      - name: Run recovery tests
        run: python3 tests/test_recovery.py
      - name: Run trash tests
        run: python3 tests/test_trash.py
      - name: Run website-trash tests
        run: python3 tests/test_web_trash.py
      - name: Run database tests
        run: python3 tests/test_database.py
      - name: Run backup tests
        run: python3 tests/test_backup.py
      - name: Run site-type tests
        run: python3 tests/test_site_types.py
      - name: Run tunnel-connect tests
        run: python3 tests/test_tunnel_connect.py
